[project]
name = "halo-brain"
version = "0.1.0"
description = "H.A.L.O. Brain process — Python/LangGraph agent loop, WS server."
requires-python = ">=3.11"
dependencies = [
    "websockets>=14",
    "sqlite-vec>=0.1",
    "fastembed>=0.3",
    "httpx>=0.27",
    "keyring>=25",
    # Pin below 2: StateSnapshot.interrupts (graph.rehydrate_pending) does not
    # exist before langgraph 0.6, so a clean install landing on 0.2.x would
    # silently fail to rehydrate pending Tier-3 approvals after a Brain restart.
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=2",
    # Imported directly in graph.py; do not rely on the transitive edge from
    # langgraph-checkpoint-sqlite.
    "aiosqlite>=0.20",
    "pypdfium2>=4",
    "pypdf>=5",
    "mammoth>=1.9",
    "openpyxl>=3.1",
    "markdownify>=0.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["brain*"]
