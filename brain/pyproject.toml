[project]
name = "halo-brain"
version = "0.1.0"
description = "H.A.L.O. Brain process — Python/LangGraph agent loop, WS server."
requires-python = ">=3.11"
dependencies = [
    "websockets>=14",
    "sqlite-vec>=0.1",
    "fastembed>=0.3",
    "httpx>=0.27",
    "keyring>=25",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["brain*"]
