[project]
name = "halo-voice"
version = "0.1.0"
description = "H.A.L.O. Voice sidecar — Python/Pipecat realtime audio worker."
requires-python = ">=3.11"
dependencies = ["websockets>=14"]
# halo-brain (brain.ipc.contract) is installed separately in dev via
# `pip install -e ../brain`, per DEVELOPMENT.md -- not declared here since
# it isn't published anywhere pip could resolve it from.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["voice*"]
